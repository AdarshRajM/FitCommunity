<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>
        <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2196F3" />
            <stop offset="100%" stop-color="#1565C0" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
        </filter>
    </defs>
    
    <!-- Outer Shield/Hexagon Base -->
    <path d="M256 24L464 128V384L256 488L48 384V128L256 24Z" 
          fill="url(#primaryGrad)" 
          filter="url(#dropShadow)"
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linejoin="round" />
          
    <!-- Inner Overlay Hexagon -->
    <path d="M256 72L416 152V360L256 440L96 360V152L256 72Z" 
          fill="#0f172a" 
          opacity="0.9" />

    <!-- Abstract 'F' and 'C' Monogram Interlocked -->
    <g transform="translate(116, 126)" filter="url(#glow)">
        <!-- The 'C' curve representing Community and Wholeness -->
        <path d="M 230 70 A 90 90 0 1 0 230 190" 
              fill="none" 
              stroke="url(#secondaryGrad)" 
              stroke-width="32" 
              stroke-linecap="round" />
        
        <!-- The 'F' representing Fitness and Forward Motion -->
        <path d="M 120 40 L 120 220 M 120 40 L 200 40 M 120 110 L 180 110" 
              fill="none" 
              stroke="url(#primaryGrad)" 
              stroke-width="32" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
              
        <!-- Heart/Pulse Element in the center -->
        <path d="M 150 140 L 170 140 L 185 100 L 205 180 L 220 140 L 240 140" 
              fill="none" 
              stroke="#FF4081" 
              stroke-width="16" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
    </g>
</svg>
